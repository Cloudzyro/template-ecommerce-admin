<html lang="en-US">

    <meta charset="UTF-8" />

    <meta name="description" content="Back office for a small online ceramics store: sales, orders, products and stock, and customers." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kilnhouse Ceramics: store admin" />

    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
